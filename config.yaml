# Default configuration for SynthaData.
# Any parameter can be overridden via CLI arguments.

# ===== RUNNING MODE (set via --mode or GUI dropdown) =====
#   api     : Online API only (rotates across keys/providers). Fastest when quota allows.
#   offline : Local Ollama only. No internet, no quota limits, zero data leakage.
#   hybrid  : Online API primary; falls back to Ollama if all quotas/rates are exhausted.
#   augment : API generates high-quality seed rows -> Ollama locally expands dataset.
mode: hybrid

# Model used for local OFFLINE generation (modes: offline, hybrid, augment).
# Recommend general-purpose models (e.g. gemma4:e4b, granite4.1:8b) for natural/domain text.
offline:
  model: gemma4:e4b
  host: http://localhost:11434

provider:
  # ===== DEFAULT ACTIVE: Groq (Fast, generous free tier) =====
  #   1) Get free API key: https://console.groq.com
  #   2) Copy .env.example to .env and set: GROQ_API_KEY=gsk_...
  type: openai
  model: llama-3.3-70b-versatile
  api_key_env: GROQ_API_KEY
  base_url: https://api.groq.com/openai/v1
  host: http://localhost:11434

  # ===== API ROTATION (Multiple keys / multiple providers) =====
  # Option 1: Multiple keys for the SAME provider in .env separated by commas:
  #   GROQ_API_KEY=gsk_key1,gsk_key2,gsk_key3
  #
  # Option 2: Multiple DIFFERENT providers in rotation:
  # rotation:
  #   - { preset: gemini }                          # Google Gemini
  #   - { preset: openrouter }                      # OpenRouter (free models available)
  #   - { preset: cerebras }                        # Cerebras
  #   - { preset: together }                        # Together AI
  #   - { preset: deepseek, model: deepseek-chat }  # DeepSeek
  #   - { api_key_env: GROQ_API_KEY_2 }              # Additional Groq key
  #
  # Available presets: groq, gemini, openrouter, cerebras, together, deepseek,
  #                    mistral, xai, fireworks, perplexity, openai, anthropic, ollama.

  max_retries: 4
  timeout: 180

# Embedding model for SEMANTIC VECTOR DEDUPLICATION (runs locally via Ollama).
embedding:
  type: ollama                 # ollama | openai | hashing | none
  # Multilingual model: bge-m3 works well across English and Vietnamese.
  # Pull via: `ollama pull bge-m3` or use lighter `nomic-embed-text`.
  model: bge-m3
  host: http://localhost:11434
  # When using OpenAI embeddings:
  # type: openai
  # model: text-embedding-3-small
  # api_key_env: OPENAI_API_KEY
  fallback_to_hashing: true    # Falls back to lexical hashing if embedder fails

# Continuous Quality Assurance (QA) pipeline.
quality:
  fuzzy_threshold: 0.92        # >= string similarity considered duplicate
  semantic_enabled: true       # Enable semantic vector cosine deduplication
  semantic_threshold: 0.96     # >= cosine similarity considered semantic duplicate
  monitor_every: 100           # Print quality snapshot every N accepted records
  rolling_window: 200          # Sliding window for rolling acceptance rate
  adaptive: true               # Dynamically boost temperature when acceptance drops
  min_rolling_accept: 0.25
  temp_boost_step: 0.15
  temp_max: 1.3

generation:
  target_rows: 1000            # Target dataset size (default 1000)
  batch_size: 10               # Records per generation request
  workers: 2                   # Concurrent generation threads
  temperature: 0.9             # Generation randomness / diversity
  max_tokens: 4096             # Max generation token allowance
  max_attempts_factor: 8.0     # Maximum attempt multiplier before terminating
  avoid_sample_size: 60        # Negative prompt window to prevent repeating items
  stall_rounds: 12             # Consecutive stalled rounds before declaring exhaustion

output:
  path: output/diseases.csv
  checkpoint: true             # Incremental disk writes; safe to stop and resume
  write_rejects: true          # Log rejected records with failure codes
  encoding: utf-8-sig          # UTF-8 with BOM for Excel and spreadsheet viewers
